survey:
  entity: "ATCRetail,ATCConstructoras,ATCRegiones,Workcenter"
  url:
    ATCRetail: "SELECT InvitationLink FROM SurveyInvitation WHERE Name = 'ATC Retail Enlace Publico' AND Survey.Name = 'ATC - Retail'"
    ATCConstructoras: "SELECT InvitationLink FROM SurveyInvitation WHERE Name = 'ATC Constructora Enlace Publico' AND Survey.Name = 'ATC - Constructora'"
    ATCRegiones : "SELECT InvitationLink FROM SurveyInvitation WHERE Name = 'ATC Regiones Enlace Publico' AND Survey.Name = 'ATC - Regiones'"
    Workcenter: "SELECT InvitationLink FROM SurveyInvitation WHERE Name = 'Workcenter Enlace Publico' AND Survey.Name = 'Workcenter'"  
  query:
    ATCRetail: "SELECT Id, FirstName, Email, Tienda_Obra__c, Tienda_Obra__r.Global_regi_n__c FROM Contact WHERE Email != null AND Tienda_Obra__c in (SELECT TiendaObra__c FROM Shopeo__c WHERE TiendaObra__c != null AND CreatedDate = LAST_N_MONTHS:1)"
    ATCConstructoras: "SELECT Id, FirstName, Email, Title, Tienda_Obra__c, Tienda_Obra__r.Global_regi_n__c FROM Contact Where Email != null AND Tienda_Obra__c in (SELECT Tienda_Obra_asociada__c FROM Visita_T_cnica__c WHERE Tienda_Obra_asociada__c != null AND RecordType.DeveloperName = 'Asistencia_T_cnica' AND CreatedDate = LAST_N_MONTHS:1 AND Tienda_Obra_asociada__r.Global_regi_n__c = 'Metropolitana de Santiago')"
    ATCRegiones : "SELECT Id, FirstName, Email, Title, Tienda_Obra__c, Tienda_Obra__r.Global_regi_n__c FROM Contact WHERE Email != null AND Tienda_Obra__c in (SELECT Tienda_Obra_asociada__c FROM Visita_T_cnica__c WHERE Tienda_Obra_asociada__c != null AND RecordType.DeveloperName = 'Asistencia_T_cnica' AND CreatedDate = LAST_N_MONTHS:1 AND Tienda_Obra_asociada__r.Global_regi_n__c != 'Metropolitana de Santiago' AND Tienda_Obra_asociada__r.Global_regi_n__c != null)"
    Workcenter: "SELECT Id, FirstName, Email, Title FROM Contact WHERE Email != null AND Id in (SELECT SBQQ__PrimaryContact__c FROM SBQQ__Quote__c WHERE RecordType.DeveloperName = 'VCPQ_Cotizacion_Workcenter' AND SBQQ__PrimaryContact__c != null AND VCPQ_FechaCierreOportunidad__c = LAST_N_MONTHS:1 AND VCPQ_UrlBoletaFactura__c != null)"

