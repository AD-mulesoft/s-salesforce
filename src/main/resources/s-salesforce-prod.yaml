    Tiernda_Obra__c-Insert: "SELECT recordtype.Name, C_digo_Ramo_global__c, VLC_Calle_Direccion__c, VLC_Numero_Direccion__c, Canal_1_1__c, Canal_1_2__c, Canal_2_1__c, Canal_2_2__c, Canal_3_1__c, Canal_3_2__c, Cod_Cliente_Cuenta__c, Global_Comuna_Zona_de_transporte__c, Concepto_de_B_squeda_1__c, Concepto_de_B_squeda_2__c, Cond_Pago__c, Cuenta_contable_asociada__c, Grupo_de_Clientes__c, Grupo_de_cliente_Distribuidor__c, Grupo_de_imputaci_n__c, Grupo_de_tesorer_a__c, Incoterms_c__c, Incoterms_parte_2__c, VLC_Codigo_SAP_Usuario__c, Name, Nombre_de_Fantasia__c, Oficina_de_Venta_1__c, Oficina_de_Venta_2__c, Oficina_de_Venta_3__c, Organizaci_n_1__c, Organizaci_n_2__c, Organizaci_n_3__c, Pais__c, Prioridad_Entrega__c, Ramo__c, Global_regi_n__c, Rut__c, Tratamiento__c, Zona_de_Venta__c FROM Tiernda_Obra__c WHERE Id = 'REPLACEID'"
